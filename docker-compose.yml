version: '3.8'
  # PostgreSQL 컨테이너 시작
  # docker-compose up -d

  # 컨테이너가 정상적으로 시작되었는지 확인
  # docker-compose ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_DEV_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DBNAME}
      POSTGRES_USER: ${POSTGRES_DEV_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DEV_USERNAME} -d ${POSTGRES_DEV_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsight-network

volumes:
  postgres_data:
    driver: local

networks:
  finsight-network:
    driver: bridge